<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jeevamithran — Monthly Family Management Plan</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon"/>
  <link rel="stylesheet" href="/src/styles/main.css"/>
</head>
<body>

<!-- ══════════════════════════════════════════════════ -->
<!-- AUTH SCREENS (shown when not logged in)           -->
<!-- ══════════════════════════════════════════════════ -->
<div id="authScreen" style="display:none;position:fixed;inset:0;background:linear-gradient(135deg,#1B5E20,#2E7D32);z-index:9999;display:flex;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:20px;padding:40px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.3)">
    <div style="text-align:center;margin-bottom:28px">
      <div style="font-size:48px">🍛</div>
      <h1 style="color:#1B5E20;margin:8px 0 4px;font-size:34px;text-align:center;font-weight:800;letter-spacing:-0.5px">Jeevamithran</h1>
      <p style="color:#2E7D32;font-size:17px;font-weight:700;text-align:center;margin:4px 0">Monthly Family Management Plan</p>
    </div>

    <!-- Login Form -->
    <div id="loginForm">
      <h3 style="margin:0 0 16px;color:#333">Sign In</h3>
      <input id="loginEmail" type="email" placeholder="Email" class="auth-input"/>
      <input id="loginPassword" type="password" placeholder="Password" class="auth-input"/>
      <button onclick="handleLogin()" class="auth-btn">Sign In</button>
      <button onclick="handleGoogleLogin()" class="auth-btn auth-btn-google">
        <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right:8px;vertical-align:middle"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>
      <p style="text-align:center;margin:16px 0 0;font-size:14px;color:#666">
        No account? <a href="#" onclick="showRegister()" style="color:#2E7D32;font-weight:600">Register</a>
        · <a href="#" onclick="showForgotPassword()" style="color:#888">Forgot password?</a>
      </p>
      <div id="loginError" style="display:none;color:#c62828;font-size:13px;margin-top:10px;padding:8px 12px;background:#ffebee;border-radius:8px"></div>
    </div>

    <!-- Register Form -->
    <div id="registerForm" style="display:none">
      <h3 style="margin:0 0 16px;color:#333">Create Account</h3>
      <input id="regName" type="text" placeholder="Full Name" class="auth-input"/>
      <input id="regEmail" type="email" placeholder="Email" class="auth-input"/>
      <input id="regPassword" type="password" placeholder="Password (min 6 chars)" class="auth-input"/>
      <button onclick="handleRegister()" class="auth-btn">Create Account</button>
      <p style="text-align:center;margin:16px 0 0;font-size:14px;color:#666">
        Already registered? <a href="#" onclick="showLogin()" style="color:#2E7D32;font-weight:600">Sign In</a>
      </p>
      <div id="registerError" style="display:none;color:#c62828;font-size:13px;margin-top:10px;padding:8px 12px;background:#ffebee;border-radius:8px"></div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════ -->
<!-- MAIN APP (shown when logged in)                   -->
<!-- ══════════════════════════════════════════════════ -->
<div id="appRoot" style="display:none">

  <!-- TOP NAV BAR -->
  <header class="topBar">
    <div class="topBarInner">
      <div class="brandName" style="text-align:center;line-height:1.2">🍛 Jeevamithran<br><span style="font-size:11px;font-weight:400;opacity:.85;letter-spacing:.5px">Monthly Family Management Plan</span></div>
      <div class="navTabs" id="navTabs">
        <button class="tab active" onclick="switchTab('plan')">Plan</button>
        <button class="tab" onclick="switchTab('menu')">Menu</button>
        <button class="tab" onclick="switchTab('grocery')">Grocery</button>
        <button class="tab" onclick="switchTab('recipes')">Recipes</button>
        <button class="tab" onclick="switchTab('diet')">Diet</button>
        <button class="tab" onclick="switchTab('history')">History</button>
        <button class="tab" onclick="switchTab('prefs')">Prefs</button>
        <button class="tab" onclick="switchTab('profile')">Profile</button>
      </div>
      <button onclick="handleLogout()" style="background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:13px">Sign Out</button>
    </div>
  </header>

  <!-- STATS GRID (hidden on grocery/recipe/prefs/profile) -->
  <div id="statsGrid" class="statsGrid"></div>

  <!-- MAIN CONTENT -->
  <main id="mainContent">
    <div id="tabContent" class="tabContent"></div>
  </main>

</div>

<!-- SCRIPTS -->
<script type="module" src="/src/main.js"></script>
<style>
.auth-input {
  display:block;width:100%;box-sizing:border-box;padding:12px 16px;
  border:1.5px solid #ddd;border-radius:10px;font-size:15px;
  margin-bottom:12px;outline:none;transition:border-color .2s;
}
.auth-input:focus { border-color:#2E7D32; }
.auth-btn {
  display:flex;align-items:center;justify-content:center;
  width:100%;padding:13px;border:none;border-radius:10px;
  background:linear-gradient(135deg,#2E7D32,#43A047);
  color:#fff;font-size:15px;font-weight:600;cursor:pointer;
  margin-bottom:10px;
}
.auth-btn-google { background:#fff;border:1.5px solid #ddd;color:#333; }
.auth-btn-google:hover { background:#f5f5f5; }
</style>
</body>
</html>
